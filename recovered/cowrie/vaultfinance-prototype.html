<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultFinance | Personal &amp; Business Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(229, 231, 235, 1); }
        .local-badge { font-size: 0.65rem; background: #10b981; color: white; padding: 2px 6px; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [transactions, setTransactions] = useState([
                { id: 1, date: '2023-10-01', desc: 'Flour (50kg)', amount: -45000, cat: 'Inventory', account: 'Business', vendor: 'Market A', unitPrice: 900 },
                { id: 2, date: '2023-10-05', desc: 'Sales Revenue', amount: 120000, cat: 'Sales', account: 'Business', vendor: 'Direct' },
                { id: 3, date: '2023-10-08', desc: 'Flour (50kg)', amount: -42000, cat: 'Inventory', account: 'Business', vendor: 'Wholesaler B', unitPrice: 840 },
                { id: 4, date: '2023-10-10', desc: 'Lunch', amount: -5000, cat: 'Food', account: 'Personal', vendor: 'Cafe' },
            ]);

            const [showAddModal, setShowAddModal] = useState(false);

            // Logic for "True Story" Analysis
            const businessInflow = transactions.filter(t => t.account === 'Business' && t.amount > 0).reduce((acc, t) => acc + t.amount, 0);
            const businessOutflow = transactions.filter(t => t.account === 'Business' && t.amount < 0).reduce((acc, t) => acc + Math.abs(t.amount), 0);
            const profit = businessInflow - businessOutflow;

            const NavItem = ({ id, icon, label }) => (
                <button
                    onClick={() => setActiveTab(id)}
                    className={`flex flex-col items-center justify-center w-full py-3 ${activeTab === id ? 'text-blue-600' : 'text-gray-400'}`}
                >
                    <i data-lucide={icon} className="w-6 h-6"></i>
                    <span className="text-[10px] mt-1 font-medium">{label}</span>
                </button>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24 relative bg-gray-50 shadow-2xl">
                    {/* Header */}
                    <header className="p-6 bg-white border-b sticky top-0 z-10">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold text-gray-800">VaultFinance</h1>
                                <span className="local-badge">LOCAL-ONLY ENCRYPTION</span>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">
                                JD
                            </div>
                        </div>
                    </header>

                    {/* Content */}
                    <main className="p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                {/* Profit Card */}
                                <div className="bg-blue-600 rounded-3xl p-6 text-white shadow-lg">
                                    <p className="text-blue-100 text-sm">Total Business Profit</p>
                                    <h2 className="text-3xl font-bold mt-1">₦{profit.toLocaleString()}</h2>
                                    <div className="flex mt-4 space-x-4 text-xs">
                                        <div className="bg-white/20 p-2 rounded-lg flex-1">
                                            <p className="opacity-80">Inflow</p>
                                            <p className="font-bold">₦{businessInflow.toLocaleString()}</p>
                                        </div>
                                        <div className="bg-white/20 p-2 rounded-lg flex-1">
                                            <p className="opacity-80">Outgoing</p>
                                            <p className="font-bold">₦{businessOutflow.toLocaleString()}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Price Intelligence Section */}
                                <div className="bg-white rounded-2xl p-4 border border-gray-100">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="font-bold text-gray-800">Price Intelligence</h3>
                                        <i data-lucide="trending-down" className="text-green-500 w-5 h-5"></i>
                                    </div>
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center p-2 bg-green-50 rounded-lg border border-green-100">
                                            <div>
                                                <p className="text-xs text-gray-500">Cheapest Flour (50kg)</p>
                                                <p className="font-semibold text-green-700">Wholesaler B</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-lg font-bold text-green-700">₦840</p>
                                                <p className="text-[10px] text-green-600">per kg</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Recent Activity */}
                                <div>
                                    <h3 className="font-bold text-gray-800 mb-3 px-1">Recent Story</h3>
                                    <div className="space-y-3">
                                        {transactions.map(t => (
                                            <div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center">
                                                <div className="flex items-center space-x-3">
                                                    <div className={`p-2 rounded-xl ${t.amount > 0 ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                                        <i data-lucide={t.amount > 0 ? "arrow-up-right" : "shopping-cart"} className="w-5 h-5"></i>
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-gray-800 text-sm">{t.desc}</p>
                                                        <p className="text-[10px] text-gray-400 uppercase tracking-wider">{t.vendor} • {t.account}</p>
                                                    </div>
                                                </div>
                                                <p className={`font-bold ${t.amount > 0 ? 'text-green-600' : 'text-gray-800'}`}>
                                                    {t.amount > 0 ? '+' : ''}{t.amount.toLocaleString()}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'import' && (
                            <div className="space-y-6">
                                <div className="bg-orange-50 border border-orange-100 p-4 rounded-2xl">
                                    <h3 className="text-orange-800 font-bold flex items-center">
                                        <i data-lucide="alert-circle" className="w-4 h-4 mr-2"></i>
                                        Fragmented Data Detected
                                    </h3>
                                    <p className="text-xs text-orange-700 mt-1">We found gaps in your records for May - July. Import a bank statement to reconstruct your story.</p>
                                </div>
                                <div className="border-2 border-dashed border-gray-300 rounded-3xl p-10 text-center bg-white">
                                    <i data-lucide="file-text" className="w-12 h-12 text-gray-300 mx-auto mb-4"></i>
                                    <p className="text-sm font-medium text-gray-600">Upload Bank Statement (PDF/CSV)</p>
                                    <button className="mt-4 px-6 py-2 bg-gray-800 text-white rounded-full text-sm font-semibold">Browse Files</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Quick Entry Button */}
                    <button
                        onClick={() => setShowAddModal(true)}
                        className="fixed bottom-28 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center z-20 active:scale-90 transition-transform"
                    >
                        <i data-lucide="plus" className="w-8 h-8"></i>
                    </button>

                    {/* Navigation Bar */}
                    <nav className="fixed bottom-0 max-w-md w-full bg-white border-t border-gray-200 flex justify-around items-center px-4 z-10">
                        <NavItem id="dashboard" icon="layout-dashboard" label="Intelligence" />
                        <NavItem id="import" icon="history" label="Fix Gaps" />
                        <NavItem id="inventory" icon="bar-chart-3" label="Trends" />
                        <NavItem id="settings" icon="shield-check" label="Vault" />
                    </nav>

                    {/* Simple Modal Simulation */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end animate-in fade-in duration-300">
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-[32px] p-8 space-y-6 animate-in slide-in-from-bottom duration-300">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xl font-bold">New Entry</h3>
                                    <button onClick={() => setShowAddModal(false)}><i data-lucide="x"></i></button>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button className="flex flex-col items-center p-6 border rounded-2xl bg-blue-50 border-blue-100 text-blue-700">
                                        <i data-lucide="camera" className="mb-2"></i>
                                        <span className="text-xs font-bold uppercase">Scan Receipt</span>
                                    </button>
                                    <button className="flex flex-col items-center p-6 border rounded-2xl hover:bg-gray-50">
                                        <i data-lucide="mic" className="mb-2"></i>
                                        <span className="text-xs font-bold uppercase">Market Voice</span>
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    <input type="number" placeholder="₦ Amount" className="w-full text-3xl font-bold border-b border-gray-200 py-4 focus:outline-none" />
                                    <input type="text" placeholder="What did you buy? (e.g. Tomatoes)" className="w-full text-lg border-b border-gray-200 py-4 focus:outline-none" />
                                    <button className="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold">Save to Local Vault</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Refresh icons after render
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
